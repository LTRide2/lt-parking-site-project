AWSTemplateFormatVersion: "2010-09-09"
Description: >
  LTRide secrets stack (bootstrap — deploy FIRST). Owns every secret for the
  environment in one place: the RDS master credentials (ltride/db) and the Flask
  application secret (ltride/app). Both values are generated here so no password
  or key is ever typed or committed. The database stack resolves the DB password
  from ltride/db, and the compute stack reads both secrets on the box.

# -----------------------------------------------------------------------------
# Parameters (all six declared — deploy.sh passes the same params/<env>.json to
# every stack, and CloudFormation rejects overrides a template does not declare.
# None are used here; the secrets are self-contained.)
# -----------------------------------------------------------------------------
Parameters:
  AdminCidr:       { Type: String, Description: (Unused here) }
  KeyName:         { Type: AWS::EC2::KeyPair::KeyName, Description: (Unused here) }
  DomainName:      { Type: String, Description: (Unused here) }
  HostedZoneId:    { Type: String, Description: (Unused here) }
  WebInstanceType: { Type: String, Description: (Unused here) }
  DbInstanceClass: { Type: String, Description: (Unused here) }

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
Resources:

  # RDS master credentials. GenerateSecretString builds JSON like
  # {"username":"ltride","password":"<random>"}. ExcludeCharacters keeps out
  # characters that would break a URL or shell quoting when the box builds
  # DATABASE_URL from these values.
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: ltride/db
      Description: LTRide RDS master credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ltride"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"@/\ ''`$'

  # Flask application secret. secret_key signs sessions/JWTs; keeping it here
  # (rather than regenerating it on every boot) means tokens survive a reboot.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: ltride/app
      Description: LTRide Flask application secret (SECRET_KEY)
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: secret_key
        PasswordLength: 48
        ExcludeCharacters: '"@/\ ''`$'

# -----------------------------------------------------------------------------
# Outputs / Exports
# -----------------------------------------------------------------------------
# The database stack resolves ltride/db by name; the compute stack imports both
# ARNs below to grant the instance least-privilege read access to exactly these
# two secrets.
# -----------------------------------------------------------------------------
Outputs:
  DbSecretArn:
    Description: Secrets Manager ARN holding the DB username/password
    Value: !Ref DbSecret
    Export: { Name: ltride-DbSecretArn }
  AppSecretArn:
    Description: Secrets Manager ARN holding the Flask SECRET_KEY
    Value: !Ref AppSecret
    Export: { Name: ltride-AppSecretArn }
