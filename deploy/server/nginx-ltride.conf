# =============================================================================
# nginx site config for LTRide
# Goes on the server at: /etc/nginx/sites-available/ltride
# Enabled by symlinking it into:    /etc/nginx/sites-enabled/ltride
#
# What nginx does here (it wears two hats):
#   1. Static web server — serves the built React site (the files release.sh
#      rsyncs into /var/www/ltride).
#   2. Reverse proxy — forwards every /api/... request to gunicorn, which is
#      listening only on localhost:8000 (not exposed to the internet directly).
#
# After editing this file on the server:  sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    # --- which requests this block handles --------------------------------
    listen 80;                       # plain HTTP on port 80 (certbot adds 443/TLS later)
    listen [::]:80;                  # the same, over IPv6

    # The hostname(s) this site answers to. `_` is "match anything" — fine when
    # you only reach the box by its IP. Once you own a domain, certbot rewrites
    # this to your real name (e.g. ltride.example.edu) so HTTPS can be issued.
    server_name _;

    # Uploaded map images can be larger than nginx's tiny 1 MB default, which
    # would make POST /api/lots/:id/map fail with "413 Request Entity Too Large".
    # 10 MB is plenty for a campus photo; raise if you need bigger files.
    client_max_body_size 10M;

    # --- hat #1: serve the React build -----------------------------------
    root /var/www/ltride;            # where release.sh puts the built dist/ files
    index index.html;

    location / {
        # SPA fallback. React Router owns the URLs (/login, /admin, /student).
        # Those paths are NOT real files on disk, so a normal web server would
        # 404 on a refresh of /admin. try_files says: "try the exact file, then
        # a directory, and if neither exists, hand back index.html" — letting
        # the React app boot and route client-side. THIS is what makes deep
        # links and page refreshes work for a single-page app.
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted JS/CSS bundles (Vite names them with a hash,
    # so a new build = a new filename; caching them forever is safe).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- hat #2: reverse-proxy the API to gunicorn ------------------------
    location /api/ {
        # Forward to gunicorn on localhost. gunicorn binds to 127.0.0.1:8000 so
        # the only way in from the internet is THROUGH nginx (one front door).
        proxy_pass http://127.0.0.1:8000;

        # Pass through the real client info so Flask/logs see the true visitor,
        # not "127.0.0.1" (which is just nginx talking to gunicorn).
        proxy_set_header Host              $host;               # original Host header
        proxy_set_header X-Real-IP         $remote_addr;        # client's IP
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;             # http or https

        proxy_read_timeout 30s;          # give up if the backend hangs >30s
    }

    # Let the health check be hit without the /api prefix too (optional).
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/health;
    }
}
